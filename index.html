<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieLens: Your Ultimate Movie Guide</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-900 text-slate-200">

    <div class="container px-4 py-8">

        <!-- Header -->
        <header class="text-center mb-10">
            <h1 class="text-5xl font-extrabold text-white leading-tight mb-2">MovieLens</h1>
            <p class="text-xl text-slate-400">Your ultimate guide to the latest and greatest films.</p>
        </header>

        <!-- Search and Filters Section -->
        <section class="mb-12">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search for a movie, actor, or genre..." class="w-full pl-12 pr-4 py-4 rounded-lg bg-slate-800 text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div class="flex flex-col sm:flex-row space-y-4 sm:space-y-0 sm:space-x-4 mt-6">
                <select id="genreFilter" class="w-full sm:w-1/3 p-3 rounded-lg bg-slate-800 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <option value="">All Genres</option>
                    <option value="Action">Action</option>
                    <option value="Comedy">Comedy</option>
                    <option value="Thriller">Thriller</option>
                    <option value="Drama">Drama</option>
                    <option value="Romance">Romance</option>
                    <option value="Sci-Fi">Sci-Fi</option>
                </select>
                <select id="ratingFilter" class="w-full sm:w-1/3 p-3 rounded-lg bg-slate-800 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <option value="0">All Ratings</option>
                    <option value="5">5 Stars</option>
                    <option value="4">4 Stars & Up</option>
                    <option value="3">3 Stars & Up</option>
                    <option value="2">2 Stars & Up</option>
                    <option value="1">1 Star & Up</option>
                </select>
                <select id="adultRatingFilter" class="w-full sm:w-1/3 p-3 rounded-lg bg-slate-800 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <option value="">All Adult Ratings</option>
                    <option value="PG">PG</option>
                    <option value="PG-13">PG-13</option>
                    <option value="R">R</option>
                    <option value="U/A">U/A</option>
                </select>
            </div>
        </section>

        <!-- Movie Listings -->
        <section id="movieList" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- Movie cards will be inserted here by JavaScript -->
        </section>
        
        <!-- No results found message -->
        <p id="noResults" class="text-center text-slate-400 text-lg mt-12 hidden">No movies match your search criteria.</p>

    </div>

    <script>
        // Sample movie data. In a real-world app, this would be fetched from a database or API.
        const movies = [
            {
                title: "Param Sundari",
                banner: "https://www.deccanchronicle.com/h-upload/2025/08/31/1953141-param-sundari.jpg",
                adultRating: "U/A",
                stars: 4,
                feedback: "A feel-good entertainer with a blend of humour, drama, romance and cultural flavors. The chemistry between the leads is a highlight.",
                ottPlatform: "Netflix",
                boxOffice: "₹16.25 Crore (2 days)",
                casting: "Sidharth Malhotra, Janhvi Kapoor, Sanjay Kapoor",
                details: "Romance, Comedy"
            },
            {
                title: "War 2",
                banner: "https://staticimg.amarujala.com/assets/images/2023/05/23/750x506/vara-2_1684814804.jpeg" ,
                adultRating: "U/A",
                stars: 3,
                feedback: "High-octane moments and striking visuals make for a passable big-screen experience. Strictly watchable only for the action.",
                ottPlatform: "JioHotstar",
                boxOffice: "₹234.31 Crore (18 days)",
                casting: "Hrithik Roshan, Jr NTR, Kiara Advani",
                details: "Action, Thriller"
            },
            {
                title: "Odum Kuthira Chaadum Kuthira",
                banner: "https://img.onmanorama.com/content/dam/mm/en/entertainment/entertainment-news/images/2025/4/14/kuthira-poster-fahadh.jpg?w=1120&h=583",
                adultRating: "U/A",
                stars: 4,
                feedback: "A beautiful blend of comedy, drama, and romance, with stunning visuals and a strong lead pairing. A perfect Onam entertainer.",
                ottPlatform: "Amazon Prime Video",
                boxOffice: "₹3.25 Crore (opening)",
                casting: "Fahadh Faasil, Kalyani Priyadarshan, Lal",
                details: "Comedy, Drama"
            },
            {
                title: "Thunderbolts",
                banner: "https://comicbookmovie.com/images/articles/banners/thunderbolts-marvels-misfit-heroes-assemble-for-new-mike-ike-teaser-and-banner-ab216914.jpg",
                adultRating: "PG-13",
                stars: 3,
                feedback: "A gritty ensemble film with razor-sharp action and layered character arcs, though some viewers might find the plot convoluted.",
                ottPlatform: "JioHotstar",
                boxOffice: "N/A (OTT Release)",
                casting: "Florence Pugh, Sebastian Stan, Wyatt Russell",
                details: "Action, Sci-Fi"
            },
            {
                title: "Metro... In Dino",
                banner: "https://i.ytimg.com/vi/Wm2R3aJPY2M/maxresdefault.jpg",
                adultRating: "PG-13",
                stars: 4.5,
                feedback: "An anthology of urban love stories that received positive reviews. A soulful soundtrack and stellar cast make it a must-watch.",
                ottPlatform: "Netflix",
                boxOffice: "N/A (OTT Release)",
                casting: "Sara Ali Khan, Aditya Roy Kapur, Ali Fazal",
                details: "Romance, Drama"
            },
            {
                title: "Superman",
                banner: "https://www.supermansupersite.com/Superman_2025/superman_teaser_poster_banner.jpg",
                adultRating: "PG",
                stars: 4,
                feedback: "A fresh take on the Man of Steel with a compelling story and new cast members that successfully reboots the DC universe.",
                ottPlatform: "Amazon Prime Video",
                boxOffice: "N/A (OTT Release)",
                casting: "David Corenswet, Rachel Brosnahan, Nicholas Hoult",
                details: "Action, Sci-Fi"
            }
        ];

        const movieListEl = document.getElementById('movieList');
        const searchInput = document.getElementById('searchInput');
        const genreFilter = document.getElementById('genreFilter');
        const ratingFilter = document.getElementById('ratingFilter');
        const adultRatingFilter = document.getElementById('adultRatingFilter');
        const noResultsEl = document.getElementById('noResults');

        const renderStars = (rating) => {
            const fullStars = Math.floor(rating);
            const halfStar = rating % 1 !== 0;
            const emptyStars = 5 - fullStars - (halfStar ? 1 : 0);
            let starsHtml = '';
            for (let i = 0; i < fullStars; i++) {
                starsHtml += '<span class="star-filled text-2xl">★</span>';
            }
            if (halfStar) {
                starsHtml += '<span class="star-filled text-2xl">½</span>'; // Using a half star symbol
            }
            for (let i = 0; i < emptyStars; i++) {
                starsHtml += '<span class="star-empty text-2xl">★</span>';
            }
            return starsHtml;
        };

        const renderMovies = () => {
            const searchQuery = searchInput.value.toLowerCase();
            const selectedGenre = genreFilter.value;
            const minRating = parseFloat(ratingFilter.value);
            const selectedAdultRating = adultRatingFilter.value;

            const filteredMovies = movies.filter(movie => {
                const titleMatch = movie.title.toLowerCase().includes(searchQuery);
                const castingMatch = movie.casting.toLowerCase().includes(searchQuery);
                const feedbackMatch = movie.feedback.toLowerCase().includes(searchQuery);
                
                const genreMatch = selectedGenre ? movie.details.includes(selectedGenre) : true;
                const ratingMatch = movie.stars >= minRating;
                const adultRatingMatch = selectedAdultRating ? movie.adultRating === selectedAdultRating : true;

                return (titleMatch || castingMatch || feedbackMatch) && genreMatch && ratingMatch && adultRatingMatch;
            });

            movieListEl.innerHTML = '';
            if (filteredMovies.length === 0) {
                noResultsEl.classList.remove('hidden');
            } else {
                noResultsEl.classList.add('hidden');
                filteredMovies.forEach(movie => {
                    const movieCard = `
                        <div class="movie-card rounded-xl overflow-hidden shadow-lg p-5">
                            <!-- Movie Banner -->
                            <img src="${movie.banner}" alt="${movie.title} Banner" class="w-full h-auto rounded-lg mb-4">
                            
                            <!-- Movie Title & Rating -->
                            <div class="flex justify-between items-center mb-2">
                                <h3 class="text-2xl font-bold text-white">${movie.title}</h3>
                                <span class="text-xl font-semibold bg-gray-700 text-white rounded-full px-3 py-1">${movie.adultRating}</span>
                            </div>
                            
                            <!-- 5-Star Rating -->
                            <div class="flex items-center mb-4">
                                <div class="flex">
                                    ${renderStars(movie.stars)}
                                </div>
                                <span class="text-sm text-slate-400 ml-2">(${movie.stars} / 5)</span>
                            </div>
                            
                            <!-- Short Feedback -->
                            <p class="text-slate-400 text-sm mb-4">"${movie.feedback}"</p>
                            
                            <!-- Details Section -->
                            <div class="space-y-2 text-slate-300 text-sm">
                                <p><span class="font-semibold text-white">OTT Platform:</span> ${movie.ottPlatform}</p>
                                <p><span class="font-semibold text-white">Box Office:</span> ${movie.boxOffice}</p>
                                <p><span class="font-semibold text-white">Casting:</span> ${movie.casting}</p>
                                <p><span class="font-semibold text-white">Genre:</span> ${movie.details}</p>
                            </div>
                        </div>
                    `;
                    movieListEl.innerHTML += movieCard;
                });
            }
        };

        // Event listeners for search and filters
        searchInput.addEventListener('input', renderMovies);
        genreFilter.addEventListener('change', renderMovies);
        ratingFilter.addEventListener('change', renderMovies);
        adultRatingFilter.addEventListener('change', renderMovies);

        // Initial render
        document.addEventListener('DOMContentLoaded', renderMovies);
    </script>
</body>
</html>
