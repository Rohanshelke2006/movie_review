<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieLens | Smart Global Movie Guide</title>
    
    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .movie-card {
            background-color: #1e293b;
            border: 1px solid #334155;
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .movie-card:hover { 
            transform: translateY(-6px); 
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            border-color: #4f46e5;
        }
        .suggestions-box::-webkit-scrollbar {
            width: 6px;
        }
        .suggestions-box::-webkit-scrollbar-thumb {
            background-color: #475569;
            border-radius: 3px;
        }
        
        .bg-banner-item {
            transition: opacity 0.8s ease-in-out;
        }
    </style>
</head>
<body class="bg-gray-950 text-slate-200 antialiased min-h-screen relative overflow-x-hidden">

    <div id="dynamicHeroGrid" class="absolute top-0 left-0 w-full h-[620px] grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-2 p-2 opacity-45 pointer-events-none z-0 overflow-hidden select-none">
        <div class="bg-slate-900/60 h-48 rounded-lg overflow-hidden"><img class="bg-banner-item w-full h-full object-cover" src="" alt=""></div>
        <div class="bg-slate-900/60 h-48 rounded-lg overflow-hidden"><img class="bg-banner-item w-full h-full object-cover" src="" alt=""></div>
        <div class="bg-slate-900/60 h-48 rounded-lg overflow-hidden"><img class="bg-banner-item w-full h-full object-cover" src="" alt=""></div>
        <div class="bg-slate-900/60 h-48 rounded-lg overflow-hidden"><img class="bg-banner-item w-full h-full object-cover" src="" alt=""></div>
        <div class="bg-slate-900/60 h-48 rounded-lg overflow-hidden"><img class="bg-banner-item w-full h-full object-cover" src="" alt=""></div>
        <div class="bg-slate-900/60 h-48 rounded-lg overflow-hidden"><img class="bg-banner-item w-full h-full object-cover" src="" alt=""></div>
        <div class="bg-slate-900/60 h-48 rounded-lg overflow-hidden"><img class="bg-banner-item w-full h-full object-cover" src="" alt=""></div>
        <div class="bg-slate-900/60 h-48 rounded-lg overflow-hidden"><img class="bg-banner-item w-full h-full object-cover" src="" alt=""></div>
        <div class="bg-slate-900/60 h-48 rounded-lg overflow-hidden"><img class="bg-banner-item w-full h-full object-cover" src="" alt=""></div>
        <div class="bg-slate-900/60 h-48 rounded-lg overflow-hidden"><img class="bg-banner-item w-full h-full object-cover" src="" alt=""></div>
        <div class="bg-slate-900/60 h-48 rounded-lg overflow-hidden"><img class="bg-banner-item w-full h-full object-cover" src="" alt=""></div>
        <div class="bg-slate-900/60 h-48 rounded-lg overflow-hidden"><img class="bg-banner-item w-full h-full object-cover" src="" alt=""></div>
    </div>

    <div class="absolute top-0 left-0 w-full h-[650px] bg-gradient-to-b from-black/90 via-gray-950/60 to-gray-950 pointer-events-none z-10"></div>

    <div class="container mx-auto px-4 py-8 max-w-7xl relative z-20">
        <header class="text-center mb-12 pt-6">
            <div class="flex items-center justify-center gap-4 mb-3 drop-shadow-[0_4px_12px_rgba(0,0,0,1)]">
                <img src="logo.png" alt="MovieLens Logo" class="w-16 h-16 object-contain rounded-xl drop-shadow-[0_4px_12px_rgba(234,179,8,0.4)]">
                
                <h1 class="text-6xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-amber-400 via-blue-500 to-purple-600 tracking-tight">
                    MovieLens
                </h1>
            </div>
            <p class="text-xl text-slate-300 font-medium drop-shadow-[0_2px_4px_rgba(0,0,0,0.8)]">Smart prediction search with global international coverage.</p>
        </header>

        <section class="mb-12 bg-slate-900/75 p-6 rounded-2xl border border-slate-800/80 backdrop-blur-xl relative z-50 shadow-2xl">
            <div class="relative">
                <input type="text" id="searchInput" autocomplete="off" placeholder="Type a movie or series name (auto-correct suggestions will appear)..." class="w-full pl-6 pr-4 py-4 rounded-xl bg-slate-950/85 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 border border-slate-800 transition-all shadow-inner">
                
                <div id="suggestionsBox" class="suggestions-box absolute left-0 right-0 mt-2 max-h-60 overflow-y-auto bg-slate-950/95 border border-slate-800 rounded-xl shadow-2xl hidden z-50 backdrop-blur-lg"></div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mt-6">
                <select id="typeFilter" class="w-full p-3 rounded-lg bg-slate-950 text-slate-300 focus:outline-none border border-slate-800 cursor-pointer">
                    <option value="all">All Formats</option>
                    <option value="movie">Movies Only</option>
                    <option value="tv">Web Series Only</option>
                </select>

                <select id="sortFilter" class="w-full p-3 rounded-lg bg-slate-950 text-slate-300 focus:outline-none border border-slate-800 cursor-pointer">
                    <option value="popularity.desc">Popularity (Trending)</option>
                    <option value="vote_average.desc">Rating (Top Rated)</option>
                    <option value="primary_release_date.desc">Release Date (Newest)</option>
                </select>

                <select id="regionFilter" class="w-full p-3 rounded-lg bg-slate-950 text-slate-300 focus:outline-none border border-slate-800 cursor-pointer">
                    <option value="all">All Regions (Global Mixed)</option>
                    <option value="IN">India (Bollywood / Regional)</option>
                    <option value="KR">South Korea (K-Dramas / Thrillers)</option>
                    <option value="JP">Japan (Anime / Cinema)</option>
                    <option value="TH">Thailand (Thai Drama/Horror)</option>
                    <option value="ID">Indonesia</option>
                    <option value="MY">Malaysia</option>
                    <option value="DE">Germany</option>
                    <option value="FR">France</option>
                    <option value="ES">Spain</option>
                    <option value="US">United States (Hollywood)</option>
                    <option value="GB">United Kingdom</option>
                </select>
            </div>
        </section>

        <div id="loading" class="text-center my-12 hidden">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-indigo-500 border-t-transparent mb-2"></div>
            <p class="text-indigo-400 font-medium">Securing remote data link...</p>
        </div>
        
        <section id="movieList" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8"></section>
        
        <p id="noResults" class="text-center text-slate-500 text-lg mt-12 hidden">No matches found. Try checking your parameters.</p>
    </div>

    <script>
        const PROXY_SERVER_URL = 'https://movielens-backend-r9v7.onrender.com/api/movies';
        const IMAGE_URL = 'https://image.tmdb.org/t/p/w500';

        const movieListEl = document.getElementById('movieList');
        const searchInput = document.getElementById('searchInput');
        const suggestionsBox = document.getElementById('suggestionsBox');
        const typeFilter = document.getElementById('typeFilter');
        const sortFilter = document.getElementById('sortFilter');
        const regionFilter = document.getElementById('regionFilter');
        const noResultsEl = document.getElementById('noResults');
        const loadingEl = document.getElementById('loading');

        let rollingTitleList = [];

        const renderStars = (voteAverage) => {
            const stars = Math.round(voteAverage / 2);
            let starsHtml = '';
            for (let i = 0; i < 5; i++) {
                starsHtml += i < stars ? '<span class="text-amber-400 text-xl">★</span>' : '<span class="text-slate-700 text-xl">★</span>';
            }
            return starsHtml;
        };

        const updateHeroBackgroundBanners = (results) => {
            const imageElements = document.querySelectorAll('.bg-banner-item');
            if (!results || results.length === 0) return;
            
            imageElements.forEach((img, index) => {
                const dataItem = results[index % results.length];
                if (dataItem) {
                    const backdropPath = dataItem.backdrop_path || dataItem.poster_path;
                    if (backdropPath) {
                        img.src = IMAGE_URL + backdropPath;
                        img.style.opacity = '1';
                    }
                }
            });
        };

        const fetchContent = async (targetQuery = '') => {
            loadingEl.classList.remove('hidden');
            movieListEl.innerHTML = '';
            noResultsEl.classList.add('hidden');

            const query = targetQuery || searchInput.value.trim();
            const type = typeFilter.value;
            const sortBy = sortFilter.value;
            const region = regionFilter.value;

            let params = new URLSearchParams();

            if (query) {
                params.append('endpoint', `search/${type === 'all' ? 'multi' : type}`);
                params.append('query', query);
                params.append('include_adult', 'false');
            } else {
                if (type === 'all' && region === 'all') {
                    params.append('endpoint', 'trending/all/week');
                } else {
                    params.append('endpoint', `discover/${type === 'all' ? 'movie' : type}`);
                    params.append('sort_by', sortBy);
                    if (region !== 'all') {
                        params.append('watch_region', region);
                        const langMap = { IN:'hi|te|ta|ml', KR:'ko', JP:'ja', TH:'th', ID:'id', MY:'ms', DE:'de', FR:'fr', ES:'es', US:'en', GB:'en' };
                        params.append('with_original_language', langMap[region] || 'en');
                    }
                }
            }

            try {
                const response = await fetch(`${PROXY_SERVER_URL}?${params.toString()}`);
                const data = await response.json();
                
                const itemsList = data.results || [];
                displayResults(itemsList);
                
                if (itemsList.length > 0) {
                    updateHeroBackgroundBanners(itemsList);
                }
                
                if (!query) {
                    rollingTitleList = itemsList.map(item => item.title || item.name).filter(Boolean);
                }
            } catch (error) {
                console.error("Secure tracking bridge failure:", error);
                noResultsEl.classList.remove('hidden');
            } finally {
                loadingEl.classList.add('hidden');
            }
        };

        const handleSearchInput = async () => {
            const val = searchInput.value.trim().toLowerCase();
            if (val.length < 2) {
                suggestionsBox.classList.add('hidden');
                return;
            }

            try {
                const type = typeFilter.value;
                const endpoint = `search/${type === 'all' ? 'multi' : type}`;
                const response = await fetch(`${PROXY_SERVER_URL}?endpoint=${endpoint}&query=${encodeURIComponent(val)}&include_adult=false`);
                const data = await response.json();
                
                const remoteMatches = (data.results || []).slice(0, 6);

                if (remoteMatches.length > 0) {
                    suggestionsBox.innerHTML = '';
                    remoteMatches.forEach(item => {
                        const name = item.title || item.name;
                        const date = item.release_date || item.first_air_date ? ` (${(item.release_date || item.first_air_date).split('-')[0]})` : '';
                        if (!name) return;

                        const row = document.createElement('div');
                        row.className = 'px-5 py-3 text-sm text-slate-300 hover:bg-indigo-600 hover:text-white cursor-pointer border-b border-slate-800/60 last:border-none transition-colors';
                        row.innerHTML = `<span class="font-semibold">${name}</span><span class="text-xs text-slate-400 ml-1">${date}</span>`;
                        
                        row.addEventListener('click', () => {
                            searchInput.value = name;
                            suggestionsBox.classList.add('hidden');
                            fetchContent(name);
                        });
                        suggestionsBox.appendChild(row);
                    });
                    suggestionsBox.classList.remove('hidden');
                } else {
                    suggestionsBox.classList.add('hidden');
                }
            } catch (err) {
                console.error("Autocomplete fetch error:", err);
            }
        };

        const displayResults = (items) => {
            if (items.length === 0) { noResultsEl.classList.remove('hidden'); return; }
            
            items.forEach(item => {
                const title = item.title || item.name || 'Untitled Discovery';
                const type = item.media_type === 'tv' || typeFilter.value === 'tv' ? 'Web Series' : 'Movie';
                const banner = item.backdrop_path ? (IMAGE_URL + item.backdrop_path) : (item.poster_path ? (IMAGE_URL + item.poster_path) : '');
                const rating = item.vote_average ? item.vote_average.toFixed(1) : '0.0';
                const description = item.overview || "No plot summary available.";
                const trackingScore = item.popularity ? Math.round(item.popularity) : 'N/A';
                
                const rawDate = item.release_date || item.first_air_date;
                const formattedDate = rawDate ? new Date(rawDate).toLocaleDateString('en-US', {
                    year: 'numeric', month: 'short'
                }) : 'TBD';

                movieListEl.innerHTML += `
                    <div class="movie-card rounded-2xl overflow-hidden flex flex-col justify-between">
                        <div>
                            <div class="relative bg-slate-950 h-52 overflow-hidden flex items-center justify-center">
                                <img src="${banner}" alt="${title}" onerror="this.src='https://placehold.co/600x400/0f172a/ffffff?text=${encodeURIComponent(title)}'" class="w-full h-full object-cover">
                                <span class="absolute top-3 right-3 text-[10px] font-bold tracking-widest uppercase px-2.5 py-1 rounded-md bg-indigo-600/90 text-white backdrop-blur-sm shadow-lg">
                                    ${type}
                                </span>
                            </div>
                            <div class="p-5 pb-0">
                                <h3 class="text-xl font-bold text-white mb-1.5 line-clamp-1" title="${title}">${title}</h3>
                                <div class="flex items-center mb-3 gap-2">
                                    <div class="flex">${renderStars(item.vote_average || 0)}</div>
                                    <span class="text-xs font-semibold text-slate-400 bg-slate-800 px-1.5 py-0.5 rounded">(${rating}/10)</span>
                                </div>
                                <p class="text-slate-400 text-sm leading-relaxed mb-4 line-clamp-3">"${description}"</p>
                            </div>
                        </div>
                        <div class="p-5 pt-0">
                            <div class="grid grid-cols-2 gap-2 text-[11px] border-t border-slate-700/50 pt-3.5 text-slate-400 font-medium">
                                <div><span class="text-slate-500 block uppercase tracking-wider text-[9px]">Released</span> ${formattedDate}</div>
                                <div><span class="text-slate-500 block uppercase tracking-wider text-[9px]">Trend Score</span> ${trackingScore}</div>
                            </div>
                        </div>
                    </div>`;
            });
        };

        let inputTimeout;
        searchInput.addEventListener('input', () => {
            clearTimeout(inputTimeout);
            inputTimeout = setTimeout(() => {
                handleSearchInput();
                fetchContent();
            }, 350);
        });

        document.addEventListener('click', (e) => {
            if (e.target !== searchInput && e.target !== suggestionsBox) {
                suggestionsBox.classList.add('hidden');
            }
        });

        typeFilter.addEventListener('change', () => fetchContent());
        sortFilter.addEventListener('change', () => fetchContent());
        regionFilter.addEventListener('change', () => fetchContent());
        
        document.addEventListener('DOMContentLoaded', () => fetchContent());
    </script>
</body>
</html>
