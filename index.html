<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieLens: Your Ultimate Movie & Web Series Guide</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .movie-card {
            background-color: #1e293b;
            border: 1px solid #334155;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .movie-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body class="bg-gray-900 text-slate-200">

    <div class="container mx-auto px-4 py-8 max-w-7xl">

        <header class="text-center mb-10">
            <h1 class="text-5xl font-extrabold text-white leading-tight mb-2">MovieLens</h1>
            <p class="text-xl text-slate-400">Your ultimate guide to the latest and greatest films & web series.</p>
        </header>

        <section class="mb-12 bg-slate-800/50 p-6 rounded-2xl border border-slate-700">
            <div class="search-box relative">
                <input type="text" id="searchInput" placeholder="Search for a movie, web series, actor, or genre..." class="w-full pl-6 pr-4 py-4 rounded-lg bg-slate-800 text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 border border-slate-700">
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mt-6">
                <select id="typeFilter" class="w-full p-3 rounded-lg bg-slate-800 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 border border-slate-700">
                    <option value="">All Formats (Movies & Series)</option>
                    <option value="Movie">Movies Only</option>
                    <option value="Web Series">Web Series Only</option>
                </select>

                <select id="genreFilter" class="w-full p-3 rounded-lg bg-slate-800 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 border border-slate-700">
                    <option value="">All Genres</option>
                    <option value="Action">Action</option>
                    <option value="Comedy">Comedy</option>
                    <option value="Thriller">Thriller</option>
                    <option value="Drama">Drama</option>
                    <option value="Romance">Romance</option>
                    <option value="Sci-Fi">Sci-Fi</option>
                    <option value="Crime">Crime</option>
                    <option value="Biography">Biography</option>
                </select>

                <select id="ratingFilter" class="w-full p-3 rounded-lg bg-slate-800 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 border border-slate-700">
                    <option value="0">All Ratings</option>
                    <option value="5">5 Stars</option>
                    <option value="4">4 Stars & Up</option>
                    <option value="3">3 Stars & Up</option>
                    <option value="2">2 Stars & Up</option>
                </select>

                <select id="adultRatingFilter" class="w-full p-3 rounded-lg bg-slate-800 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 border border-slate-700">
                    <option value="">All Maturity Ratings</option>
                    <option value="U">U / PG</option>
                    <option value="U/A">U/A / PG-13</option>
                    <option value="A">A / R</option>
                </select>
            </div>
        </section>

        <section id="movieList" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
            </section>
        
        <p id="noResults" class="text-center text-slate-400 text-lg mt-12 hidden">No movies or web series match your search criteria.</p>

    </div>

    <script>
        // Updated mid-2026 database featuring fresh content formats
        const contentDatabase = [
            {
                title: "Gullak (Season 5)",
                type: "Web Series",
                banner: "https://images.slivcdn.com/landscape_thumb/Gullak_S5_Landscape_Thumb.jpg", 
                adultRating: "U/A",
                stars: 4.5,
                feedback: "The Mishra family returns with timeless middle-class relatability. This season delicately balances scaling growth with their core baseline humor and heartfelt warmth.",
                ottPlatform: "SonyLIV",
                boxOffice: "N/A (Streaming Hit)",
                casting: "Jameel Khan, Geetanjali Kulkarni, Harsh Mayar, Vaibhav Raj Gupta",
                details: "Comedy, Drama"
            },
            {
                title: "Brown",
                type: "Web Series",
                banner: "https://images.zee5.com/images/Karisma_Kapoor_Brown_Banner.jpg",
                adultRating: "A",
                stars: 4,
                feedback: "Karisma Kapoor delivers a tour de force performance as Rita Brown—a broken, alcoholic detective tracking a brutal murder mystery hidden beneath Kolkata's social elite.",
                ottPlatform: "ZEE5",
                boxOffice: "N/A",
                casting: "Karisma Kapoor, Helen, Soni Razdan, Surya Sharma",
                details: "Crime, Thriller, Drama"
            },
            {
                title: "Made In India: A Titan Story",
                type: "Web Series",
                banner: "https://images.amazon.com/images/Titan_Story_Banner.jpg",
                adultRating: "U",
                stars: 4,
                feedback: "An expertly structured corporate biographical drama charting Xerxes Desai's vision to construct India's proudest watch brand. Naseeruddin Shah is stellar as JRD Tata.",
                ottPlatform: "Amazon MX Player / Prime Video",
                boxOffice: "N/A",
                casting: "Jim Sarbh, Naseeruddin Shah, Vaibhav Tatwawadi, Namita Dubey",
                details: "Biography, Drama"
            },
            {
                title: "Maa Behen",
                type: "Movie",
                banner: "https://images.netflix.com/Maa_Behen_Madhuri_Dixit.jpg",
                adultRating: "U/A",
                stars: 3.5,
                feedback: "A quirky, slightly uneven but wildly entertaining dark comedy where Madhuri Dixit and Triptii Dimri break domestic conventions trying to obscure an accidental home casualty.",
                ottPlatform: "Netflix",
                boxOffice: "N/A (Direct to OTT)",
                casting: "Madhuri Dixit, Triptii Dimri, Ravi Kishan",
                details: "Comedy, Drama"
            },
            {
                title: "Dhurandhar: The Revenge",
                type: "Movie",
                banner: "https://images.jiohotstar.com/Dhurandhar_The_Revenge_Ranveer.jpg",
                adultRating: "A",
                stars: 4,
                feedback: "Following a triumphant theatrical box office run, this espionage thriller delivers explosive choreography and high stakes as Hamza returns for a lethal vendetta.",
                ottPlatform: "JioHotstar",
                boxOffice: "₹340+ Crore (Lifetime)",
                casting: "Ranveer Singh, Hamza Ali Mazari",
                details: "Action, Thriller"
            },
            {
                title: "Office Romance",
                type: "Movie",
                banner: "https://images.netflix.com/Office_Romance_JLo.jpg",
                adultRating: "U/A",
                stars: 4,
                feedback: "A glossy, old-school workplace rom-com. The electric comedic tension between Jennifer Lopez's high-flying CEO and Brett Goldstein's straight-faced lawyer carries the film easily.",
                ottPlatform: "Netflix",
                boxOffice: "N/A",
                casting: "Jennifer Lopez, Brett Goldstein, Tony Hale, Betty Gilpin",
                details: "Romance, Comedy"
            }
        ];

        const movieListEl = document.getElementById('movieList');
        const searchInput = document.getElementById('searchInput');
        const typeFilter = document.getElementById('typeFilter');
        const genreFilter = document.getElementById('genreFilter');
        const ratingFilter = document.getElementById('ratingFilter');
        const adultRatingFilter = document.getElementById('adultRatingFilter');
        const noResultsEl = document.getElementById('noResults');

        const renderStars = (rating) => {
            const fullStars = Math.floor(rating);
            const halfStar = rating % 1 !== 0;
            const emptyStars = 5 - fullStars - (halfStar ? 1 : 0);
            let starsHtml = '';
            for (let i = 0; i < fullStars; i++) {
                starsHtml += '<span class="text-amber-400 text-xl">★</span>';
            }
            if (halfStar) {
                starsHtml += '<span class="text-amber-400 text-xl">½</span>';
            }
            for (let i = 0; i < emptyStars; i++) {
                starsHtml += '<span class="text-slate-600 text-xl">★</span>';
            }
            return starsHtml;
        };

        const renderMovies = () => {
            const searchQuery = searchInput.value.toLowerCase();
            const selectedType = typeFilter.value;
            const selectedGenre = genreFilter.value;
            const minRating = parseFloat(ratingFilter.value);
            const selectedAdultRating = adultRatingFilter.value;

            const filteredData = contentDatabase.filter(item => {
                const titleMatch = item.title.toLowerCase().includes(searchQuery);
                const castingMatch = item.casting.toLowerCase().includes(searchQuery);
                const feedbackMatch = item.feedback.toLowerCase().includes(searchQuery);
                
                const typeMatch = selectedType ? item.type === selectedType : true;
                const genreMatch = selectedGenre ? item.details.includes(selectedGenre) : true;
                const ratingMatch = item.stars >= minRating;
                
                // Map custom groupings for adult ratings (e.g., U covers PG, A covers R)
                let adultRatingMatch = true;
                if (selectedAdultRating) {
                    if (selectedAdultRating === "U") {
                        adultRatingMatch = (item.adultRating === "U" || item.adultRating === "PG");
                    } else if (selectedAdultRating === "U/A") {
                        adultRatingMatch = (item.adultRating === "U/A" || item.adultRating === "PG-13");
                    } else if (selectedAdultRating === "A") {
                        adultRatingMatch = (item.adultRating === "A" || item.adultRating === "R");
                    }
                }

                return (titleMatch || castingMatch || feedbackMatch) && typeMatch && genreMatch && ratingMatch && adultRatingMatch;
            });

            movieListEl.innerHTML = '';
            if (filteredData.length === 0) {
                noResultsEl.classList.remove('hidden');
            } else {
                noResultsEl.classList.add('hidden');
                filteredData.forEach(item => {
                    const cardHtml = `
                        <div class="movie-card rounded-xl overflow-hidden shadow-lg p-5 flex flex-col justify-between">
                            <div>
                                <div class="relative bg-slate-900 h-48 rounded-lg mb-4 overflow-hidden flex items-center justify-center">
                                    <img src="${item.banner}" alt="${item.title} Banner" onerror="this.src='https://placehold.co/600x400/1e293b/ffffff?text=${encodeURIComponent(item.title)}'" class="w-full h-full object-cover">
                                    <span class="absolute top-2 right-2 text-xs font-bold tracking-wider uppercase px-2 py-1 rounded bg-indigo-600 text-white shadow-md">
                                        ${item.type}
                                    </span>
                                </div>
                                
                                <div class="flex justify-between items-start gap-2 mb-2">
                                    <h3 class="text-xl font-bold text-white line-clamp-2">${item.title}</h3>
                                    <span class="text-xs font-semibold bg-slate-700 text-slate-300 rounded px-2 py-1 shrink-0">${item.adultRating}</span>
                                </div>
                                
                                <div class="flex items-center mb-3">
                                    <div class="flex mr-2">
                                        ${renderStars(item.stars)}
                                    </div>
                                    <span class="text-xs text-slate-400">(${item.stars}/5)</span>
                                </div>
                                
                                <p class="text-slate-400 text-sm italic mb-4 line-clamp-3">"${item.feedback}"</p>
                            </div>
                            
                            <div class="space-y-1.5 text-slate-300 text-xs border-t border-slate-700/60 pt-3">
                                <p><span class="font-medium text-slate-400">Platform:</span> ${item.ottPlatform}</p>
                                <p><span class="font-medium text-slate-400">Box Office:</span> ${item.boxOffice}</p>
                                <p class="truncate"><span class="font-medium text-slate-400">Cast:</span> ${item.casting}</p>
                                <p><span class="font-medium text-slate-400">Genre:</span> ${item.details}</p>
                            </div>
                        </div>
                    `;
                    movieListEl.innerHTML += cardHtml;
                });
            }
        };

        // Event listeners
        searchInput.addEventListener('input', renderMovies);
        typeFilter.addEventListener('change', renderMovies);
        genreFilter.addEventListener('change', renderMovies);
        ratingFilter.addEventListener('change', renderMovies);
        adultRatingFilter.addEventListener('change', renderMovies);

        // Initial setup execution
        document.addEventListener('DOMContentLoaded', renderMovies);
    </script>
</body>
</html>
