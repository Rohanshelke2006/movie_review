<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieLens: Your Automated Movie & Web Series Guide</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .movie-card {
            background-color: #1e293b;
            border: 1px solid #334155;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .movie-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body class="bg-gray-900 text-slate-200">

    <div class="container mx-auto px-4 py-8 max-w-7xl">

        <header class="text-center mb-10">
            <h1 class="text-5xl font-extrabold text-white leading-tight mb-2">MovieLens</h1>
            <p class="text-xl text-slate-400">Live, automatically updating guide to the world's trending films & TV shows.</p>
        </header>

        <section class="mb-12 bg-slate-800/50 p-6 rounded-2xl border border-slate-700">
            <div class="search-box relative">
                <input type="text" id="searchInput" placeholder="Search for any movie or web series globally..." class="w-full pl-6 pr-4 py-4 rounded-lg bg-slate-800 text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 border border-slate-700">
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 mt-6">
                <select id="typeFilter" class="w-full p-3 rounded-lg bg-slate-800 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 border border-slate-700">
                    <option value="all">All Formats (Trending)</option>
                    <option value="movie">Movies Only</option>
                    <option value="tv">Web Series Only</option>
                </select>

                <select id="sortFilter" class="w-full p-3 rounded-lg bg-slate-800 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 border border-slate-700">
                    <option value="popularity.desc">Popularity (High to Low)</option>
                    <option value="vote_average.desc">Rating (Top Rated)</option>
                    <option value="primary_release_date.desc">Release Date (Newest First)</option>
                </select>

                <select id="regionFilter" class="w-full p-3 rounded-lg bg-slate-800 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 border border-slate-700">
                    <option value="IN">Indian Releases</option>
                    <option value="US">Hollywood / Global Releases</option>
                </select>
            </div>
        </section>

        <div id="loading" class="text-center text-indigo-400 text-xl font-semibold my-12 hidden">
            Fetching latest updates from database...
        </div>

        <section id="movieList" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
            </section>
        
        <p id="noResults" class="text-center text-slate-400 text-lg mt-12 hidden">No titles found. Try adjusting your search query.</p>

    </div>

    <script>
        // Your integrated TMDb API configurations
        const API_KEY = 'cfbf2e26010e31d54aefb040ed817236'; 
        const BASE_URL = 'https://api.themoviedb.org/3';
        const IMAGE_URL = 'https://image.tmdb.org/t/p/w500';

        const movieListEl = document.getElementById('movieList');
        const searchInput = document.getElementById('searchInput');
        const typeFilter = document.getElementById('typeFilter');
        const sortFilter = document.getElementById('sortFilter');
        const regionFilter = document.getElementById('regionFilter');
        const noResultsEl = document.getElementById('noResults');
        const loadingEl = document.getElementById('loading');

        // Helper to convert 10-point API rating to 5-star metric
        const renderStars = (voteAverage) => {
            const ratingOutOfFive = voteAverage / 2;
            const fullStars = Math.floor(ratingOutOfFive);
            const halfStar = ratingOutOfFive % 1 >= 0.25 && ratingOutOfFive % 1 < 0.75;
            const extraFullStar = ratingOutOfFive % 1 >= 0.75 ? 1 : 0;
            
            const totalFull = fullStars + extraFullStar;
            const totalHalf = halfStar ? 1 : 0;
            const emptyStars = 5 - totalFull - totalHalf;

            let starsHtml = '';
            for (let i = 0; i < totalFull; i++) starsHtml += '<span class="text-amber-400 text-xl">★</span>';
            if (totalHalf) starsHtml += '<span class="text-amber-400 text-xl">½</span>';
            for (let i = 0; i < emptyStars; i++) starsHtml += '<span class="text-slate-600 text-xl">★</span>';
            
            return starsHtml;
        };

        // Core dynamic function to pull live data from the web API
        const fetchContent = async () => {
            loadingEl.classList.remove('hidden');
            movieListEl.innerHTML = '';
            noResultsEl.classList.add('hidden');

            const query = searchInput.value.trim();
            const type = typeFilter.value;
            const sortBy = sortFilter.value;
            const region = regionFilter.value;

            let url = '';

            // Handle API routes dynamically based on whether user searches or browses
            if (query) {
                url = `${BASE_URL}/search/${type === 'all' ? 'multi' : type}?api_key=${API_KEY}&query=${encodeURIComponent(query)}&include_adult=false`;
            } else {
                if (type === 'all') {
                    url = `${BASE_URL}/trending/all/week?api_key=${API_KEY}`;
                } else {
                    url = `${BASE_URL}/discover/${type}?api_key=${API_KEY}&sort_by=${sortBy}&watch_region=${region}&with_original_language=${region === 'IN' ? 'hi|te|ta|ml|bn' : 'en'}`;
                }
            }

            try {
                const response = await fetch(url);
                const data = await response.json();
                displayResults(data.results || []);
            } catch (error) {
                console.error("Error fetching live media asset data:", error);
                noResultsEl.classList.remove('hidden');
            } finally {
                loadingEl.classList.add('hidden');
            }
        };

        // Render UI elements instantly onto card objects
        const displayResults = (items) => {
            if (items.length === 0) {
                noResultsEl.classList.remove('hidden');
                return;
            }

            items.forEach(item => {
                // Map properties since TMDb names things differently for movies vs TV/web series
                const title = item.title || item.name || 'Untitled Discovery';
                const type = item.media_type ? (item.media_type === 'tv' ? 'Web Series' : 'Movie') : (typeFilter.value === 'tv' ? 'Web Series' : 'Movie');
                const banner = item.backdrop_path ? (IMAGE_URL + item.backdrop_path) : (item.poster_path ? (IMAGE_URL + item.poster_path) : '');
                const rating = item.vote_average ? item.vote_average.toFixed(1) : 'N/A';
                const feedback = item.overview ? item.overview : "No synopsis details recorded in index files yet.";
                const releaseDate = item.release_date || item.first_air_date || 'TBD';

                const cardHtml = `
                    <div class="movie-card rounded-xl overflow-hidden shadow-lg p-5 flex flex-col justify-between">
                        <div>
                            <div class="relative bg-slate-900 h-48 rounded-lg mb-4 overflow-hidden flex items-center justify-center">
                                <img src="${banner}" alt="${title} Poster" onerror="this.src='https://placehold.co/600x400/1e293b/ffffff?text=${encodeURIComponent(title)}'" class="w-full h-full object-cover">
                                <span class="absolute top-2 right-2 text-xs font-bold tracking-wider uppercase px-2 py-1 rounded bg-indigo-600 text-white shadow-md">
                                    ${type}
                                </span>
                            </div>
                            
                            <div class="mb-2">
                                <h3 class="text-xl font-bold text-white line-clamp-2">${title}</h3>
                            </div>
                            
                            <div class="flex items-center mb-3">
                                <div class="flex mr-2">
                                    ${item.vote_average && item.vote_average > 0 ? renderStars(item.vote_average) : '<span class="text-slate-500 text-xs">Unrated</span>'}
                                </div>
                                <span class="text-xs text-slate-400">(${rating}/10 globally)</span>
                            </div>
                            
                            <p class="text-slate-400 text-sm italic mb-4 line-clamp-3">"${feedback}"</p>
                        </div>
                        
                        <div class="space-y-1.5 text-slate-300 text-xs border-t border-slate-700/60 pt-3">
                            <p><span class="font-medium text-slate-400">Release Date:</span> ${releaseDate}</p>
                            <p><span class="font-medium text-slate-400">Popularity Score:</span> ${Math.round(item.popularity)}</p>
                        </div>
                    </div>
                `;
                movieListEl.innerHTML += cardHtml;
            });
        };

        // Debounced input search runner setup 
        let searchTimeout;
        searchInput.addEventListener('input', () => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(fetchContent, 400); 
        });

        // Interactive Filter Change Listeners
        typeFilter.addEventListener('change', fetchContent);
        sortFilter.addEventListener('change', fetchContent);
        regionFilter.addEventListener('change', fetchContent);

        // Initial launch setup runtime execution
        document.addEventListener('DOMContentLoaded', fetchContent);
    </script>
</body>
</html>
